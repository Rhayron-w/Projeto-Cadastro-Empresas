spring.application.name=demo

# Banco H2 em ARQUIVO (os dados continuam depois de reiniciar a aplicação).
# O arquivo é criado em demo/data/integra.mv.db
spring.datasource.url=jdbc:h2:file:./data/integra
spring.datasource.username=sa
spring.datasource.password=

# "update" cria/atualiza as tabelas sem apagar os dados
spring.jpa.hibernate.ddl-auto=update

# Remove o aviso amarelo do log
spring.jpa.open-in-view=false
