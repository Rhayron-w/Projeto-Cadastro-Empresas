spring.application.name=demo

# Banco H2 em ARQUIVO (os dados continuam depois de reiniciar a aplicação).
# O arquivo é criado em demo/data/integra.mv.db
spring.datasource.url=jdbc:h2:file:./data/integra
spring.datasource.username=sa
spring.datasource.password=

# "update" cria/atualiza as tabelas sem apagar os dados
spring.jpa.hibernate.ddl-auto=update

# Remove o aviso amarelo do log
spring.jpa.open-in-view=false

# ---- IA da EVA (servidor Python: Chat/api_server.py) ----
# Endereço base do servidor Python
eva.ia.url=http://127.0.0.1:5000
# Campo do JSON de resposta do Python que contém o texto
eva.ia.campo-resposta=reply
# Tempo máximo de espera pela IA
eva.ia.timeout-segundos=60
